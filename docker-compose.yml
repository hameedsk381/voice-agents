version: '3.8'

services:
  # --- Core Infrastructure ---
  postgres:
    image: pgvector/pgvector:pg15
    container_name: voise-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voise
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voise"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voise-network

  redis:
    image: redis:7
    container_name: voise-redis
    command: redis-server --requirepass secure_redis_password_2026
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secure_redis_password_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voise-network

  # --- Temporal Orchestration ---
  temporal:
    image: temporalio/auto-setup:latest
    container_name: voise-temporal
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # UI
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voise-network

  # --- Application ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voise-backend
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=prod
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PASSWORD=secure_redis_password_2026
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voise-network

volumes:
  postgres_data:
  temporal_data:

networks:
  voise-network:
    driver: bridge
