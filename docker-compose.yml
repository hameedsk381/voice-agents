services:
  # --- Core Infrastructure ---
  postgres:
    image: pgvector/pgvector:pg15
    container_name: voise-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voise
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voise"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voise-network

  redis:
    image: redis:7
    container_name: voise-redis
    command: redis-server --requirepass secure_redis_password_2026
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secure_redis_password_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voise-network

  # --- Temporal Orchestration ---
  temporal:
    image: temporalio/auto-setup:latest
    container_name: voise-temporal
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # UI
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voise-network

  # --- Observability: Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    container_name: voise-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - voise-network

  # --- Observability: Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: voise-grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=voise2026
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Voise AI
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - voise-network

  # --- Observability: OpenTelemetry Collector ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: voise-otel-collector
    ports:
      - "4317:4317"  # gRPC
      - "4318:4318"  # HTTP
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml
    command: ["--config=/etc/otel-collector.yml"]
    depends_on:
      - prometheus
    networks:
      - voise-network

  # --- Application ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voise-backend
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=prod
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PASSWORD=secure_redis_password_2026
      - TEMPORAL_HOST=temporal:7233
      - SECRET_KEY=voice_agents_prod_secret_key_2026
      - GROQ_API_KEY=${GROQ_API_KEY:-placeholder}
      - ULTRAVOX_API_KEY=${ULTRAVOX_API_KEY:-placeholder}
      - ULTRAVOX_DEFAULT_RECORDING_ENABLED=false
      - ULTRAVOX_RETENTION_POLICY=""
      - LOG_FORMAT=json
      - METRICS_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voise-network

volumes:
  postgres_data:
  temporal_data:
  prometheus_data:
  grafana_data:

networks:
  voise-network:
    driver: bridge
