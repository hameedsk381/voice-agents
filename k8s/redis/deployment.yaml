apiVersion: apps/v1
kind: Deployment
metadata:
  name: voise-redis
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-redis
    app.kubernetes.io/part-of: voise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voise-redis
  template:
    metadata:
      labels:
        app: voise-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          command:
            - redis-server
            - --requirepass
            - "$(REDIS_PASSWORD)"
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - "$(REDIS_PASSWORD)"
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - "$(REDIS_PASSWORD)"
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: voise-redis-pvc
