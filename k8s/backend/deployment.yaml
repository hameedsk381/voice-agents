apiVersion: apps/v1
kind: Deployment
metadata:
  name: voise-backend
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-backend
    app.kubernetes.io/part-of: voise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voise-backend
  template:
    metadata:
      labels:
        app: voise-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: backend
          image: voise/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: voise-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: SECRET_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: GROQ_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: OPENAI_API_KEY
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: DEEPGRAM_API_KEY
            - name: ULTRAVOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: ULTRAVOX_API_KEY
            - name: ULTRAVOX_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: ULTRAVOX_CALLBACK_SECRET
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: TWILIO_PHONE_NUMBER
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: SMTP_HOST
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: SMTP_FROM
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
