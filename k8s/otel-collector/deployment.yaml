apiVersion: apps/v1
kind: Deployment
metadata:
  name: voise-otel-collector
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-otel-collector
    app.kubernetes.io/part-of: voise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voise-otel-collector
  template:
    metadata:
      labels:
        app: voise-otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          args:
            - "--config=/etc/otel-collector.yml"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: prom-metrics
          volumeMounts:
            - name: config
              mountPath: /etc
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: voise-otel-collector-config
