apiVersion: v1
kind: ConfigMap
metadata:
  name: voise-otel-collector-config
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-otel-collector
    app.kubernetes.io/part-of: voise
data:
  otel-collector.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 512

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8888
        namespace: voise
        const_labels:
          service: voise-ai
      logging:
        loglevel: warn

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, logging]
