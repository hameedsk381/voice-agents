apiVersion: v1
kind: Secret
metadata:
  name: voise-secrets
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-ai
type: Opaque
stringData:
  # ⚠️ Replace these with your actual secrets or use ExternalSecret / Vault
  SECRET_KEY: "change-me-to-a-random-64-char-string"
  POSTGRES_PASSWORD: "change-me-postgres-password"
  REDIS_PASSWORD: "change-me-redis-password"
  GROQ_API_KEY: ""
  OPENAI_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  ULTRAVOX_API_KEY: ""
  ULTRAVOX_CALLBACK_SECRET: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
