apiVersion: v1
kind: Secret
metadata:
  name: voise-docker-registry
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-ai
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{}}'
