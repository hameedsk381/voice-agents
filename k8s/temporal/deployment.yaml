apiVersion: apps/v1
kind: Deployment
metadata:
  name: voise-temporal
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-temporal
    app.kubernetes.io/part-of: voise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voise-temporal
  template:
    metadata:
      labels:
        app: voise-temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:latest
          ports:
            - containerPort: 7233
              name: grpc
            - containerPort: 8233
              name: ui
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_SEEDS
              value: "voise-postgres"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 10
            periodSeconds: 10
