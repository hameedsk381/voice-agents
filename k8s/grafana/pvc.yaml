apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voise-grafana-pvc
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-grafana
    app.kubernetes.io/part-of: voise
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
