apiVersion: apps/v1
kind: Deployment
metadata:
  name: voise-grafana
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-grafana
    app.kubernetes.io/part-of: voise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voise-grafana
  template:
    metadata:
      labels:
        app: voise-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "voise2026"
            - name: GF_INSTALL_PLUGINS
              value: "grafana-piechart-panel"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: voise-grafana-datasources
        - name: dashboards
          configMap:
            name: voise-grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: voise-grafana-pvc
