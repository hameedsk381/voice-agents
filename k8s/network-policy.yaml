apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voise-default-deny
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voise-allow-backend
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: voise
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: voise
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8001
        - port: 3000
        - port: 9090
        - port: 4317
        - port: 4318
        - port: 5432
        - port: 6379
        - port: 7233
        - port: 8233
        - port: 8888
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: voise
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
        - port: 80
