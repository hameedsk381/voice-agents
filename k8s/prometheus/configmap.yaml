apiVersion: v1
kind: ConfigMap
metadata:
  name: voise-prometheus-config
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-prometheus
    app.kubernetes.io/part-of: voise
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "voise-backend"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [voise]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: voise-backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
            replacement: $1

      - job_name: "otel-collector"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [voise]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: voise-otel-collector
            action: keep
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:8888
            target_label: __address__
