apiVersion: apps/v1
kind: Deployment
metadata:
  name: voise-prometheus
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-prometheus
    app.kubernetes.io/part-of: voise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voise-prometheus
  template:
    metadata:
      labels:
        app: voise-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: voise-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: voise-prometheus-pvc
