apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voise-frontend
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-frontend
    app.kubernetes.io/part-of: voise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voise-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
