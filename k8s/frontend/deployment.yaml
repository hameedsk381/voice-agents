apiVersion: apps/v1
kind: Deployment
metadata:
  name: voise-frontend
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-frontend
    app.kubernetes.io/part-of: voise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voise-frontend
  template:
    metadata:
      labels:
        app: voise-frontend
    spec:
      containers:
        - name: frontend
          image: voise/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: voise-config
                  key: BACKEND_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
