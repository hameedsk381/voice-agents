apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voise-postgres
  namespace: voise
  labels:
    app.kubernetes.io/name: voise-postgres
    app.kubernetes.io/part-of: voise
spec:
  serviceName: voise-postgres
  replicas: 1
  selector:
    matchLabels:
      app: voise-postgres
  template:
    metadata:
      labels:
        app: voise-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg15
          ports:
            - containerPort: 5432
              name: pgql
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voise-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "voise"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "voise"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "voise"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        storageClassName: standard
